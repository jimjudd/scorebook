<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Eephus Halfliner Scorebook</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#ffffff; --ink:#14161a; --muted:#5d6470; --line:#d9dce2;
  --accent:#14161a; --radius:12px;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#101216; --panel:#191d24; --ink:#eef1f5; --muted:#9aa3b0; --line:#2b313b;
    --accent:#eef1f5;
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-size:16px; line-height:1.4; -webkit-text-size-adjust:100%;
  padding:0 0 env(safe-area-inset-bottom);
}
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 40px}
.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  padding:calc(8px + env(safe-area-inset-top)) 0 10px;
  border-bottom:1px solid var(--line);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.brand{font-weight:800;letter-spacing:-.02em;font-size:15px;margin-right:auto}
input[type=date]{
  font-family:var(--sans); font-size:15px; color:var(--ink);
  background:var(--panel); border:1px solid var(--line); border-radius:10px;
  padding:9px 12px; min-height:42px;
}
.list{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.game{
  display:block; text-decoration:none; color:inherit;
  background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
  padding:12px 14px;
}
.game:active{transform:scale(.99)}
.matchup{font-size:17px;font-weight:700}
.matchup .at{color:var(--muted);font-weight:600;margin:0 4px}
.meta{color:var(--muted);font-size:13.5px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;
  text-transform:uppercase;padding:2px 7px;border-radius:99px;border:1px solid var(--line);
  color:var(--muted)}
.badge.live{background:#cc3433;border-color:#cc3433;color:#fff}
.empty{color:var(--muted);font-style:italic;padding:24px 2px;text-align:center}
.err{background:var(--panel);border:1px solid #cc3433;border-radius:var(--radius);
  padding:14px;margin-top:12px;color:#cc3433;font-size:14.5px}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <span class="brand">EEPHUS HALFLINER</span>
    <input type="date" id="datePick" aria-label="Game date">
  </div>
  <div id="content" class="list"></div>
</div>

<script>
"use strict";
var API = "https://statsapi.mlb.com";

function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g,function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function getJSON(path, ms){
  ms = ms || 12000;
  var ctl = new AbortController();
  var timer = setTimeout(function(){ ctl.abort(); }, ms);
  return fetch(API + path, { signal: ctl.signal, cache: "no-store" })
    .then(function(r){
      if(!r.ok) throw new Error("HTTP " + r.status + " on " + path);
      return r.json();
    })
    .finally(function(){ clearTimeout(timer); });
}
function todayLocal(){
  var d = new Date();
  var m = String(d.getMonth()+1).padStart(2,"0");
  var day = String(d.getDate()).padStart(2,"0");
  return d.getFullYear() + "-" + m + "-" + day;
}
function localTZ(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone; }catch(e){ return "UTC"; }
}
function fmtTime(iso, tz){
  try{
    return new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"numeric",minute:"2-digit",hour12:true})
      .format(new Date(iso));
  }catch(e){ return "—"; }
}
function statusLabel(g){
  var abs = (g.status||{}).abstractGameState;
  if(abs === "Live") return { text: "Live", cls: "live" };
  if(abs === "Final") return { text: "Final", cls: "" };
  return { text: "Scheduled", cls: "" };
}

function render(games, dateStr){
  if(!games.length){
    $("content").innerHTML = '<div class="empty">No MLB games on ' + esc(dateStr) + '.</div>';
    return;
  }
  var tz = localTZ();
  games.sort(function(a,b){ return new Date(a.gameDate) - new Date(b.gameDate); });
  $("content").innerHTML = games.map(function(g){
    var away = g.teams.away.team, home = g.teams.home.team;
    var venueTime = fmtTime(g.gameDate, (g.venue.timeZone||{}).id || tz);
    var localTime = fmtTime(g.gameDate, tz);
    var sameZone = venueTime === localTime;
    var st = statusLabel(g);
    return '<a class="game" href="scorebook.html?gamePk=' + encodeURIComponent(g.gamePk) + '">' +
      '<div class="matchup">' + esc(away.name) + '<span class="at">@</span>' + esc(home.name) + '</div>' +
      '<div class="meta">' +
        '<span>' + esc(g.venue.name) + '</span>' +
        '<span>' + esc(venueTime) + (sameZone ? '' : ' (' + esc(localTime) + ' your time)') + '</span>' +
        '<span class="badge ' + st.cls + '">' + esc(st.text) + '</span>' +
      '</div>' +
    '</a>';
  }).join("");
}

function load(dateStr){
  $("content").innerHTML = '<div class="empty">Loading…</div>';
  getJSON("/api/v1/schedule?sportId=1&date=" + dateStr + "&hydrate=team,venue")
    .then(function(sched){
      var games = [];
      (sched.dates||[]).forEach(function(d){ (d.games||[]).forEach(function(g){ games.push(g); }); });
      render(games, dateStr);
    })
    .catch(function(err){
      $("content").innerHTML = '<div class="err"><strong>Couldn\'t load the schedule.</strong><br>' +
        esc(err.message||String(err)) + '</div>';
    });
}

function setDate(dateStr, push){
  $("datePick").value = dateStr;
  if(push){
    var u = new URL(location.href);
    if(dateStr === todayLocal()) u.searchParams.delete("date");
    else u.searchParams.set("date", dateStr);
    history.replaceState(null,"",u);
  }
  load(dateStr);
}

$("datePick").addEventListener("change", function(e){
  if(e.target.value) setDate(e.target.value, true);
});

(function(){
  var q = new URLSearchParams(location.search).get("date");
  setDate(/^\d{4}-\d{2}-\d{2}$/.test(q||"") ? q : todayLocal(), false);
})();
</script>
</body>
</html>
